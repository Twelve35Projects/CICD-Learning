name: Check website

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download the project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run the checker
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          python -c "import os; from pathlib import Path; Path('secret.txt').write_text(os.environ['DEMO_SECRET'], encoding='utf-8')"
          python check.py
