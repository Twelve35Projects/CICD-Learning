name: Check and publish website

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download the project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run the checker
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          python -c "import os; from pathlib import Path; Path('secret.txt').write_text(os.environ['DEMO_SECRET'], encoding='utf-8')"
          python check.py

      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html _site/

      - name: Upload website for publishing
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
